name: "opencode GitHub Action"
description: "Run opencode in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  version:
    description: "OpenCode release version"
    required: false
    default: "latest"

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the opencode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/opencode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.opencode.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get opencode version
      id: version
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        VERSION="$VERSION_INPUT"
        if [ "$VERSION" = latest ]; then
          VERSION=$(curl -fsSL 'https://api.github.com/repos/balcsida/opencode/releases?per_page=100' | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-ghes\.[0-9]+$' || true; } | sed -n '1p')
          if [ -z "$VERSION" ]; then
            echo "No GHES release found" >&2
            exit 1
          fi
        fi
        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ghes\.[0-9]+$ ]]; then
          echo "Invalid GHES version: $VERSION" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache opencode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install opencode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) ASSET=opencode-linux-x64.tar.gz ;;
          Linux-ARM64) ASSET=opencode-linux-arm64.tar.gz ;;
          macOS-X64) ASSET=opencode-darwin-x64.zip ;;
          macOS-ARM64) ASSET=opencode-darwin-arm64.zip ;;
          Windows-X64) ASSET=opencode-windows-x64.zip ;;
          Windows-ARM64) ASSET=opencode-windows-arm64.zip ;;
          *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        URL="https://github.com/balcsida/opencode/releases/download/$VERSION"
        mkdir -p ~/.opencode/bin
        curl -fsSLO "$URL/checksums.txt"
        curl -fsSLO "$URL/$ASSET"
        if command -v sha256sum >/dev/null; then
          grep "  $ASSET$" checksums.txt | sha256sum -c -
        else
          grep "  $ASSET$" checksums.txt | shasum -a 256 -c -
        fi
        case "$ASSET" in
          *.tar.gz) tar -xzf "$ASSET" -C ~/.opencode/bin ;;
          *) unzip -o "$ASSET" -d ~/.opencode/bin ;;
        esac

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

    - name: Run opencode
      shell: bash
      id: run_opencode
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GHES_APP_TOKEN: ${{ env.GHES_APP_TOKEN }}

name: release-cli
run-name: "release CLI ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.14.28-litellm.1)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "LiteLLM provider support build. Based on https://github.com/anomalyco/opencode/pull/14468." \
            --draft
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: ubuntu-24.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build and upload CLI
        working-directory: packages/opencode
        run: ./script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: "true"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  update-homebrew-tap:
    needs: publish-release
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch to homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"

          # Compute SHAs from the just-published release
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/opencode-darwin-arm64.zip" \
            -o opencode-arm64.zip
          SHA256_ARM64=$(shasum -a 256 opencode-arm64.zip | awk '{print $1}')
          rm opencode-arm64.zip

          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/opencode-darwin-x64.zip" \
            -o opencode-x64.zip
          SHA256_X64=$(shasum -a 256 opencode-x64.zip | awk '{print $1}')
          rm opencode-x64.zip

          gh api repos/balcsida/homebrew-tap/dispatches \
            --method POST \
            --field event_type=update-opencode-fork \
            --field client_payload="{\"version\":\"${VERSION}\",\"sha256_arm64\":\"${SHA256_ARM64}\",\"sha256_x64\":\"${SHA256_X64}\"}"

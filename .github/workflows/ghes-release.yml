name: GHES release

on:
  push:
    tags:
      - "v*-ghes.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Fork release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ghes\.[0-9]+$ ]]; then
            echo "Invalid GHES release tag: $TAG" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "upstream=${TAG%-ghes.*}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')
          if [ -z "$TAG_OBJECT" ]; then
            echo "Release tag must be annotated: $TAG" >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" --jq '.verification.verified')" != true ]; then
            echo "Release tag must have GitHub-verified signature: $TAG" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-bun

      - name: Build distributions
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: ./packages/opencode/script/build.ts

      - name: Package distributions
        shell: bash
        run: |
          mkdir release
          cd packages/opencode/dist
          for target in opencode-*; do
            if [[ "$target" == opencode-linux-* ]]; then
              tar -C "$target/bin" -czf "../../../release/$target.tar.gz" opencode
              continue
            fi
            zip -j "../../../release/$target.zip" "$target/bin/opencode"*
          done
          cd ../../../release
          sha256sum opencode-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          NOTES="$RUNNER_TEMP/ghes-release-notes.md"
          {
            printf 'Tracks upstream %s. See https://github.com/anomalyco/opencode/pull/13860.\n\n' "$UPSTREAM"
            cat <<'EOF'
          Warning: these binaries are unsigned and un-notarized. On macOS, if Gatekeeper quarantines the binary, run `xattr -d com.apple.quarantine ~/.opencode/bin/opencode` and approve it in Gatekeeper only after verifying checksums.
          EOF
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "OpenCode ${TAG#v}" --notes-file "$NOTES"
            exit
          fi
          gh release create "$TAG" release/* --title "OpenCode ${TAG#v}" --notes-file "$NOTES"
